<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de arenas</title>
<style>
:root {
  --bg: #0d1118; --panel: #151b26; --panel2: #1b2331; --line: #283246; --text: #dde5f0; --dim: #8c98ad;
  --acc: #3fd6e8; --ok: #4ade80; --bad: #ff5a5a; --warn: #ffd23f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 7px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .grp { display: flex; gap: 4px; align-items: center; }
header .lbl { color: var(--dim); font-size: 12px; margin-right: 2px; }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: #3c4a66; background: #222c3d; }
button.on { background: #17404a; border-color: var(--acc); color: #e9fbff; }
button.primary { background: #0f5563; border-color: var(--acc); }
button:disabled { opacity: .45; cursor: default; }
select, input[type=number], input[type=text], textarea { background: #0f141d; border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
input[type=number] { width: 74px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0a0d13; }
#playLayer { position: absolute; inset: 0; background: #0a0d13; }
#playLayer iframe { width: 100%; height: 100%; border: 0; display: block; }
#cv { display: block; width: 100%; height: 100%; cursor: default; touch-action: none; }
#status { position: absolute; left: 8px; bottom: 6px; padding: 3px 8px; border-radius: 5px; background: rgba(8, 11, 17, .78); color: var(--dim); font-size: 12px; pointer-events: none; font-variant-numeric: tabular-nums; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 70vw; padding: 8px 14px; border-radius: 8px; background: #1f2a3c; border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; pointer-events: none; white-space: pre-wrap; }
#toast.show { opacity: 1; }
aside { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); }
aside section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
aside h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
aside h4 { margin: 10px 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; }
.pal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pal .it { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 3px 4px; border: 1px solid var(--line); border-radius: 6px; background: #10161f; cursor: grab; font-size: 10.5px; color: var(--dim); text-align: center; overflow: hidden; }
.pal .it:hover { border-color: var(--acc); color: var(--text); }
.pal .it img { width: 100%; height: 46px; object-fit: contain; pointer-events: none; }
.pal .it span { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.f { display: inline-flex; align-items: center; gap: 5px; margin: 3px 10px 3px 0; color: var(--dim); }
.f span { min-width: 14px; }
.kv { color: var(--dim); }
.kv b { color: var(--text); font-weight: 600; }
.note { color: var(--dim); font-size: 12px; margin: 6px 0; }
.reach { display: flex; flex-direction: column; gap: 2px; }
.reach div { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.reach div:hover { background: var(--panel2); }
.reach i { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.reach .ok i { background: var(--ok); } .reach .bad i { background: var(--bad); } .reach .bad { color: #ffc2c2; }
.reach small { color: var(--dim); margin-left: auto; white-space: nowrap; }
.keys { color: var(--dim); font-size: 12px; columns: 2; column-gap: 14px; }
.keys div { break-inside: avoid; margin: 2px 0; }
kbd { background: #0f141d; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: 11px ui-monospace, Menlo, monospace; color: var(--text); }
textarea { width: 100%; min-height: 70px; resize: vertical; }
input[type=text] { width: 100%; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; max-width: min(460px, 90vw); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(4,6,10,.6); }
dialog p { margin: 0 0 10px; line-height: 1.45; }
dialog input { width: 100%; margin-bottom: 4px; }
.sl { display: grid; grid-template-columns: 74px 1fr 34px; gap: 8px; align-items: center; margin: 2px 0; color: var(--dim); }
.sl input[type=range] { width: 100%; accent-color: var(--acc); }
.sl .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
input[type=color] { width: 38px; height: 24px; padding: 0 2px; background: #0f141d; border: 1px solid var(--line); border-radius: 5px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 42vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <div class="grp"><span class="lbl">Arena</span><select id="arenaSel"></select></div>
  <div class="grp">
    <button id="bImport" title="Abrir un JSON de arena (también se puede soltar el archivo sobre el lienzo)">Importar</button>
    <button id="bExport" title="Bajar el JSON">Exportar</button>
    <button id="bCopy" title="Copiar el JSON al portapapeles">Copiar</button>
    <button id="bSave" title="Escribir prototypes/arena/arenas/&lt;nombre&gt;.json, la arena abierta (⌘S)">Guardar</button>
    <button id="bSaveAs" title="Guardarla con otro nombre: una arena nueva">Guardar como…</button>
    <button id="bPlay" class="primary" title="Jugarla acá mismo, sin guardar (P). Esc en el juego vuelve a editar. ⇧ + clic: en otra pestaña">▶ Probar</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
  <div class="grp"><button id="bUndo" title="Deshacer (⌘Z)">↶</button><button id="bRedo" title="Rehacer (⇧⌘Z)">↷</button></div>
  <div class="grp"><span class="lbl">Grilla</span><span id="gridSeg"></span></div>
  <div class="grp"><span class="lbl">Ver</span><span id="showSeg"></span><button id="bAnim" title="Mover las plataformas por su recorrido">▶ Animar</button></div>
  <div class="grp"><button id="bZoomOut">−</button><button id="bFit" title="Ajustar (0)">Ajustar</button><button id="bZoomIn">+</button></div>
</header>
<main>
  <div id="stage"><canvas id="cv"></canvas><div id="status"></div>
    <div id="playLayer" hidden><iframe id="playFrame" title="La arena en el juego"></iframe></div></div>
  <aside>
    <section id="secSel"></section>
    <section id="secColor"></section>
    <section id="secReach"></section>
    <section id="secPal"></section>
    <section>
      <h3>Atajos</h3>
      <div class="keys">
        <div><kbd>⌫</kbd> borrar</div>
        <div><kbd>⌘D</kbd> duplicar</div>
        <div><kbd>F</kbd> espejar</div>
        <div><kbd>M</kbd> copia simétrica</div>
        <div><kbd>L</kbd> patas hasta abajo</div>
        <div><kbd>←→↑↓</kbd> 1 px (<kbd>⇧</kbd> grilla)</div>
        <div><kbd>⌘Z</kbd> deshacer</div>
        <div><kbd>G</kbd> grilla</div>
        <div><kbd>0</kbd> ajustar</div>
        <div><kbd>P</kbd> probar (<kbd>Esc</kbd> vuelve)</div>
        <div><kbd>espacio</kbd>+arrastrar: mover la vista</div>
        <div><kbd>⌘</kbd>+rueda o pellizco: zoom</div>
      </div>
    </section>
  </aside>
</main>
<div id="toast"></div>
<dialog id="dlg"><form method="dialog"><p id="dlgMsg"></p><input id="dlgIn" type="text" autocomplete="off"><div class="row"><button id="dlgOk" value="ok" class="primary">Aceptar</button><button id="dlgNo" value="cancel">Cancelar</button></div></form></dialog>

<script>
"use strict";
// datos que pone build.py: las piezas del kit (las mismas medidas que en el juego), un ranger parado y las arenas de
// cuando se armó (respaldo para abrir la página sin servidor; con serve.py se leen de disco cada vez)
const KIT = __KIT_DATA__, RANGER = __RANGER_DATA__, BUILT = __ARENA_DATA__, LUT_RAW = __LUT_DATA__;
const AW = 1920, AH = 1080;
const BRIDGE_H = 26, BODY_H = 112 * 0.8, WALL_GAP = 30;   // como en src.html: lo que se atraviesa, el cuerpo, las paredes
// el alcance: la física del ranger (FEEL de src.html) y lo medido en el juego (alturas). Se pueden cambiar en el panel
const PHYS = { run: 300, v0: 1067, gUp: 2963, gDown: 4898, dbl: 0.9, term: 1400, h1: 192, h2: 333, hang: 325, halfW: 16 };
const ARENA_DIR = "../../arenas/", GAME = "../../dist/index.html?arena=editor";
const SERVED = location.protocol.startsWith("http");
const COL = { ok: "#4ade80", bad: "#ff5a5a", warn: "#ffd23f", acc: "#3fd6e8", front: "#ffb648" };
const $ = id => document.getElementById(id);
const cv = $("cv"), g = cv.getContext("2d");

/* ---------- estado ---------- */
let ARENAS = {}, key = "", A = null;
let sel = null;            // {t: "obj" | "spawn" | "solid" | "front" | "pt", i, j}
let dirty = false, saved = "";   // saved: la arena como está en disco (o como se abrió)
const hist = { undo: [], redo: [] };
const view = { k: 0.5, x: 0, y: 0 };
let grid = 16, anim = false, animT = 0, spaceDown = false, mouse = null;
const show = { col: true, reach: true, spawns: true, paths: true };

/* ---------- imágenes ---------- */
const IMG = new Map();
function img(url) {
  let e = IMG.get(url);
  if (!e) {
    e = { im: new Image(), ok: false, bad: false, alpha: null, tint: new Map() };
    e.im.onload = () => { e.ok = true; e.alpha = alphaOf(e.im); draw(); };
    e.im.onerror = () => { e.bad = true; draw(); };
    e.im.src = url; IMG.set(url, e);
  }
  return e;
}
// el alfa de cada imagen, para elegir con el mouse lo que está pintado y no la caja (las patas de una pasarela tapan la de abajo)
function alphaOf(im) {
  try {
    const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
    const t = c.getContext("2d", { willReadFrequently: true }); t.drawImage(im, 0, 0);
    const d = t.getImageData(0, 0, c.width, c.height).data, a = new Uint8Array(c.width * c.height);
    for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3];
    return { w: c.width, h: c.height, a };
  } catch (err) { return null; }   // abierta desde el disco: se elige por la caja
}
function tinted(e, color) {   // los objetos de atrás: oscurecidos, sobre la imagen ya graduada
  if (!e.tint.has(color)) {
    const src = graded(e, "plataformas"), c = document.createElement("canvas");
    c.width = src.naturalWidth || src.width; c.height = src.naturalHeight || src.height;
    const t = c.getContext("2d"); t.drawImage(src, 0, 0); t.globalCompositeOperation = "source-atop"; t.fillStyle = color; t.fillRect(0, 0, c.width, c.height);
    e.tint.set(color, c);
  }
  return e.tint.get(color);
}

/* ---------- color: el bloque "color" de la arena ---------- */
// la paleta (un LUT 3D que sale de prototypes/arena/paleta.py: la referencia de la Refinería → la versión de Pablo) con
// su fuerza, y saturación, contraste, brillo y bruma, por grupo: "fondo" (la lámina) y "plataformas" (piezas pintadas y
// objetos del kit, más los recortes de plate.solid, como en el juego). Sin bloque "color", nada se gradúa
// la cuenta es la del juego: gradePixels, decodeLut, hazeOf, NEUTRAL e isNeutral vienen de prototypes/arena/color.js,
// que build.py mete en línea más arriba
const LUT = typeof decodeLut === "function" ? decodeLut(LUT_RAW) : null;
const gradeOK = typeof gradePixels === "function";
const rgbHex = c => "#" + c.map(x => Math.round(x).toString(16).padStart(2, "0")).join("");
const hazeAuto = new Map();
// el color de la bruma: el del JSON o, si no hay, el del juego: hazeOf, el promedio de la franja de arriba de la lámina
function hazeRGB() {
  const hx = A && A.color && A.color.bruma_color;
  if (hx && /^#[0-9a-f]{6}$/i.test(hx)) { const v = parseInt(hx.slice(1), 16); return [v >> 16, (v >> 8) & 255, v & 255]; }
  const e = A && A.plate && A.plate.src ? img(ARENA_DIR + A.plate.src) : null;
  const none = typeof HAZE_DEFAULT !== "undefined" ? HAZE_DEFAULT : [143, 179, 224];   // sin lámina, el del juego
  if (!e || !e.ok || typeof hazeOf !== "function") return none;
  if (!hazeAuto.has(e.im.src)) { try { hazeAuto.set(e.im.src, hazeOf(e.im)); } catch (err) { return none; } }
  return hazeAuto.get(e.im.src);
}
// las imágenes graduadas, en caché; mientras se arrastra un control, en baja (y en alta un momento después)
const GR = new Map();
let colorKey = "", gradeLow = false, gradeTimer = 0, noColor = false;
function graded(e, group) {
  const c = A && A.color && A.color[group];
  if (noColor || !gradeOK || !e.ok || !c || isNeutral(c)) return e.im;
  const key = e.im.src + "|" + group + (gradeLow ? "|low" : "");
  let out = GR.get(key); if (out) return out;
  const s = gradeLow ? (group === "fondo" ? 0.34 : 0.5) : 1;
  const w = Math.max(1, Math.round(e.im.naturalWidth * s)), h = Math.max(1, Math.round(e.im.naturalHeight * s));
  out = document.createElement("canvas"); out.width = w; out.height = h;
  const t = out.getContext("2d", { willReadFrequently: true }); t.drawImage(e.im, 0, 0, w, h);
  try { const id = t.getImageData(0, 0, w, h); gradePixels(id.data, LUT, c, hazeRGB()); t.putImageData(id, 0, 0); } catch (err) { return e.im; }
  GR.set(key, out); return out;
}
function regrade(live = false) {
  GR.clear(); for (const e of IMG.values()) e.tint.clear();
  colorKey = JSON.stringify((A && A.color) || null) + noColor;
  gradeLow = live; clearTimeout(gradeTimer);
  if (live) gradeTimer = setTimeout(() => regrade(false), 220);
  draw();
}


/* ---------- piezas, objetos y sólidos (las mismas reglas que loadArena y loadObjects de src.html) ---------- */
// pintadas: arena.pieces[nombre] = {src, w, h, solids: [...], front: [[x, y, w, h]]}, todo relativo a la esquina de la
// pieza; el objeto que la pone tiene x, y = esa esquina. Del kit: x es el centro; y, lo que se pisa (plataformas) o la base
function def(name) {
  const p = A && A.pieces && A.pieces[name];
  if (p) return { painted: true, w: p.w, h: p.h, url: ARENA_DIR + p.src, p };
  const k = KIT.pieces[name]; if (!k) return null;
  return { painted: false, plat: name.startsWith("platforms/"), w: k.w, h: k.h, top: k.top || 0, url: k.src };
}
const isPainted = o => !!def(o.piece)?.painted;
// con recorrido (move): las del kit y también las pintadas. En una pintada cada punto es su esquina de arriba a la
// izquierda, como x, y; sus sólidos van con ella y no cuelgan (paintedMover en src.html)
const moving = o => !!(o.move && o.move.path && o.move.path.length > 1);
function objAt(o) { return moving(o) ? (anim ? pathPos(o, animT) : o.move.path[0]) : [o.x, o.y]; }
// dónde se dibuja cada punto del recorrido: en las del kit, el punto (el centro de lo que se pisa); en las pintadas, el
// centro de su sólido sobre la línea de los pies, no la esquina
function pathOff(o) {
  const d = def(o.piece); if (!d || !d.painted) return [0, 0];
  const s = (d.p.solids || [])[0]; if (!s) return [d.w / 2, 0];
  return [(o.flip ? d.w - s.x - s.w : s.x) + s.w / 2, s.y];
}
// las patas de una pintada: legs = [y0, y1] de la pieza (la franja de filas entre la losa y los pies) y stretch del
// objeto, los px que se alarga esa franja: la pieza mide h + stretch, lo de arriba de y0 queda igual y lo de abajo de y1
// baja stretch (negativo la acorta, hasta LEGS_MIN). legsGap: cuántos px por encima de lo de abajo terminan las patas
const LEGS_MIN = 8;
const legsOf = d => (d && d.painted && Array.isArray(d.p.legs) && d.p.legs[1] - d.p.legs[0] >= LEGS_MIN ? d.p.legs : null);
const clampStretch = (L, v) => Math.max(LEGS_MIN - (L[1] - L[0]), Math.round(v));
function stretchOf(o, d = def(o.piece)) { const L = legsOf(d); return L ? clampStretch(L, o.stretch || 0) : 0; }
function setStretch(o, v) { const L = legsOf(def(o.piece)); const s = L ? clampStretch(L, v) : 0; if (s) o.stretch = s; else delete o.stretch; }
function objBox(o, at = objAt(o)) {
  const d = def(o.piece); if (!d) return { x: at[0] - 32, y: at[1] - 64, w: 64, h: 64, missing: true };
  const [x, y] = at;
  if (d.painted) return { x, y, w: d.w, h: d.h + stretchOf(o, d) };
  return { x: x - d.w / 2, y: d.plat ? y - d.top : y - d.h, w: d.w, h: d.h };
}
const flipLedge = l => (l === "left" ? "right" : l === "right" ? "left" : l);
function baseSolid(s) {
  if (s.kind === "bridge") return { ...s, h: BRIDGE_H, oneWay: true };
  return { ...s, h: s.h ?? 60, ground: s.y >= 900, noLedge: s.noLedge ?? (s.kind === "box" || s.y >= 900) };
}
function objSolids(o, at = objAt(o)) {
  const d = def(o.piece); if (!d) return [];
  const [x, y] = at;
  if (d.painted) return (d.p.solids || []).map(s => {
    const w = baseSolid({ ...s, kind: s.kind || "bridge", x: x + (o.flip ? d.w - s.x - s.w : s.x), y: y + s.y });
    w.ledge = o.ledge || (o.flip ? flipLedge(s.ledge || "both") : s.ledge || "both");
    return w;
  });
  if (d.plat) return [{ kind: "platform", x: x - d.w / 2, y, w: d.w, h: BRIDGE_H, oneWay: true, noLedge: moving(o) || o.ledge === "none" }];
  if (o.solid === false || o.layer === "back") return [];
  return [{ kind: "box", x: x - d.w / 2 + 2, y: y - d.h + 3, w: d.w - 4, h: d.h - 3, noLedge: true }];
}
function frontRects(o, at = objAt(o)) {   // los recortes de una pieza pintada que van delante del colgado, en px del juego
  const d = def(o.piece); if (!d || !d.painted) return [];
  return (d.p.front || []).map(([x, y, w, h]) => [at[0] + (o.flip ? d.w - x - w : x), at[1] + y, w, h]);
}
// dónde están las patas: las columnas con algo pintado en las últimas filas de la pieza, en px de la pieza (sin el alfa,
// abierta desde el disco, toda la pieza)
function feetCols(e, d) {
  if (!e.alpha) return [[0, d.w]];
  if (!e.feet) {
    const { w, h, a } = e.alpha, q = w / d.w, out = [];
    let start = -1;
    for (let x = 0; x <= w; x++) {
      let on = false;
      for (let y = Math.max(0, h - 6); x < w && y < h && !on; y++) on = a[y * w + x] > 128;
      if (on && start < 0) start = x; else if (!on && start >= 0) { out.push([start / q, x / q]); start = -1; }
    }
    e.feet = out.length ? out : [[0, d.w]];
  }
  return e.feet;
}
// "que llegue abajo": el stretch con el que las patas terminan legsGap px por encima de lo primero que tienen debajo
// (lo más alto que pisa alguna pata, más abajo que el comienzo de la franja; lo que se mueve no cuenta). null: nada abajo
function groundStretch(i, Wd = world()) {
  const o = A.objects[i], d = def(o.piece), L = legsOf(d); if (!L) return null;
  const feet = feetCols(img(d.url), d).map(([a, b]) => (o.flip ? [o.x + d.w - b, o.x + d.w - a] : [o.x + a, o.x + b]));
  let on = null;
  for (const s of Wd.solids) {
    if (s.moving || (s.ref && s.ref.t === "obj" && s.ref.i === i) || s.y <= o.y + L[0]) continue;
    if (feet.some(([x0, x1]) => s.x < x1 && s.x + s.w > x0) && (!on || s.y < on.y)) on = s;
  }
  return on && { s: clampStretch(L, on.y - (d.p.legsGap || 0) - o.y - d.h), on };
}
let legsFollow = true;   // al mover una pintada con patas, las patas siguen hasta lo de abajo (no es parte de la arena)
// las que tienen las patas justo sobre algo, antes de mover: si se mueve lo de abajo, siguen llegando
function standing() {
  if (!legsFollow) return [];
  const Wd = world();
  return A.objects.map((o, i) => i).filter(i => { const r = groundStretch(i, Wd); return r && r.s === stretchOf(A.objects[i]); });
}
function followLegs(i, also = []) {
  if (legsFollow) for (const j of new Set([i, ...also])) { const r = groundStretch(j); if (r) setStretch(A.objects[j], r.s); }

    onclick: () => addPiece(name), ondragstart: e => e.dataTransfer.setData("text/x-piece", name) }, el("img", { src, alt: "" }), el("span", {}, label));
  const painted = Object.entries(A.pieces || {});
  box.append(el("h3", {}, "Piezas"));
  if (painted.length) box.append(el("h4", {}, "Pintadas de esta arena"), el("div", { class: "pal" }, painted.map(([n, p]) => item(n, ARENA_DIR + p.src, n))));
  const groups = [["Plataformas", "platforms/"], ["Cajas y cosas", "small_props/"], ["Grandes (decorado)", "landmarks/"]];
  for (const [t, pre] of groups) {
    const names = Object.keys(KIT.pieces).filter(n => n.startsWith(pre)); if (!names.length) continue;
    box.append(el("h4", {}, t), el("div", { class: "pal" }, names.map(n => item(n, KIT.pieces[n].src, n.slice(pre.length)))));
  }
}
cv.addEventListener("dragover", e => e.preventDefault());
cv.addEventListener("drop", e => {
  e.preventDefault();
  const name = e.dataTransfer.getData("text/x-piece"), [wx, wy] = toWorld(e);
  if (name) return addPiece(name, [wx, wy]);
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) importFile(f);
});

/* ---------- barra de arriba ---------- */
function seg(id, items, get, set) {
  const box = $(id); box.replaceChildren();
  for (const [v, t] of items) box.append(el("button", { class: get(v) ? "on" : "", onclick: () => { set(v); topbar(); draw(); } }, t));
}
function topbar() {
  seg("gridSeg", [[0, "No"], [8, "8"], [16, "16"]], v => grid === v, v => (grid = v));
  seg("showSeg", [["col", "Colisión"], ["reach", "Alcance"], ["spawns", "Spawns"], ["paths", "Recorridos"]], v => show[v], v => (show[v] = !show[v]));
  $("bAnim").classList.toggle("on", anim); $("bAnim").textContent = anim ? "■ Animar" : "▶ Animar";
  $("bPlay").textContent = playing ? "◀ Editar" : "▶ Probar"; $("bPlay").classList.toggle("on", !!playing);
  $("bUndo").disabled = !hist.undo.length; $("bRedo").disabled = !hist.redo.length;
  $("bSave").textContent = dirty ? "Guardar •" : "Guardar"; $("bSave").disabled = $("bSaveAs").disabled = !SERVED;
  const s = $("arenaSel"); s.replaceChildren(...Object.entries(ARENAS).map(([k, a]) => el("option", { value: k }, `${a.name || k}  (${k})`)), el("option", { value: "+" }, "＋ Nueva…")); s.value = key;
}
$("arenaSel").addEventListener("change", async e => {
  const v = e.target.value;
  if (dirty && !(await ask("Hay cambios sin guardar en esta arena. ¿Cambiar igual y perderlos?", { ok: "Cambiar" }))) { e.target.value = key; return; }
  if (v === "+") return newArena();
  openArena(v, ARENAS[v]);
});
$("bUndo").onclick = undo; $("bRedo").onclick = redo;
$("bFit").onclick = fit;
$("bZoomIn").onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
$("bZoomOut").onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
$("bAnim").onclick = () => { anim = !anim; animT = 0; topbar(); draw(); };
$("bImport").onclick = () => $("file").click();
$("file").addEventListener("change", e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ""; });
$("bExport").onclick = () => {
  const a = el("a", { href: URL.createObjectURL(new Blob([fmt(clean(A)) + "\n"], { type: "application/json" })), download: `${key.split("/").pop() || "arena"}.json` });
  document.body.append(a); a.click(); a.remove(); toast(`Bajado ${a.download}`);
};
$("bCopy").onclick = async () => { try { await navigator.clipboard.writeText(fmt(clean(A)) + "\n"); toast("JSON copiado"); } catch (err) { toast("No se pudo copiar"); } };
$("bSave").onclick = () => save();
$("bSaveAs").onclick = () => saveAs();
$("bPlay").onclick = e => play(e.shiftKey);

/* ---------- abrir, importar, guardar, probar ---------- */
const clean = a => JSON.parse(JSON.stringify(a));
function compact(v) {
  if (Array.isArray(v)) return "[" + v.map(compact).join(", ") + "]";
  if (v && typeof v === "object") return "{" + Object.entries(v).filter(([, x]) => x !== undefined).map(([k, x]) => JSON.stringify(k) + ": " + compact(x)).join(", ") + "}";
  return JSON.stringify(v);
}
// el mismo formato que serve.py (y que las arenas escritas a mano): una clave por renglón, cada sólido en el suyo
function fmt(v, ind = 0, depth = 0) {
  const sp = "  ".repeat(ind + 1), end = "  ".repeat(ind);
  if (v && typeof v === "object" && !Array.isArray(v) && Object.keys(v).length && depth < 2)
    return "{\n" + Object.entries(v).map(([k, x]) => `${sp}${JSON.stringify(k)}: ${fmt(x, ind + 1, depth + 1)}`).join(",\n") + "\n" + end + "}";
  if (Array.isArray(v) && v.length && v.every(x => x && typeof x === "object"))
    return "[\n" + v.map(x => sp + compact(x)).join(",\n") + "\n" + end + "]";
  return compact(v);
}
function normalize(a) {
  a.size = a.size || [AW, AH]; a.solids = a.solids || []; a.objects = a.objects || []; a.spawns = a.spawns || [];
  if (a.plate && !a.plate.solid) a.plate.solid = [];
  return a;
}
// (no se llama "open": pisaría window.open y "Probar en el juego" abriría una arena llamada about:blank)
function openArena(k, arena) {
  key = k; A = normalize(clean(arena)); sel = null; dirty = false; saved = JSON.stringify(A); hist.undo.length = hist.redo.length = 0;
  history.replaceState(null, "", "#" + k);
  if (A.plate && A.plate.src) img(ARENA_DIR + A.plate.src);
  for (const p of Object.values(A.pieces || {})) img(ARENA_DIR + p.src);
  palette(); changed(); dirty = false; keepWip(); topbar(); fit();
}
function importFile(f) {
  const rd = new FileReader();
  rd.onload = async () => {
    let a;
    try { a = JSON.parse(rd.result); if (!a.solids) throw new Error("no tiene solids"); }
    catch (err) { return toast(`No es una arena: ${err.message}`); }
    if (dirty && !(await ask("Hay cambios sin guardar. ¿Abrir el archivo igual y perderlos?", { ok: "Abrir" }))) return;
    const k = keyOf(f.name.replace(/\.json$/i, ""));
    ARENAS[k] = a; openArena(k, a); saved = ""; dirty = true; keepWip(); topbar(); toast(`Abierto ${f.name}: con Guardar queda en arenas/${k}.json`);
  };
  rd.readAsText(f);
}
const KEY_RE = /^(?:[a-z0-9_]+\/)?[a-z0-9_]+$/;
const keyOf = s => s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9_/]+/g, "_").replace(/^_+|_+$/g, "");
async function newArena() {
  const k = keyOf((await ask("Nombre del archivo de la arena nueva (queda en prototypes/arena/arenas/<nombre>.json):", { input: "nueva", ok: "Seguir" })) || "");
  if (!k) { topbar(); return; }
  const src = (await ask("La lámina: una imagen de 1920 × 1080 en prototypes/arena/arenas/ (vacío: una arena del kit, sin lámina).", { input: "", ok: "Crear" })) ?? "";
  const a = { name: k, note: "", size: [AW, AH], seed: 1, ...(src ? { plate: { src, solid: [] } } : {}), solids: [{ kind: "walk", x: -40, y: 940, w: 2000, h: 200, fill: "full" }], objects: [], spawns: [[480, 940], [1440, 940]], decor: [], pipes: [] };
  ARENAS[k] = a; openArena(k, a); saved = ""; dirty = true; keepWip(); topbar();
}
// guardar: escribe arenas/<nombre>.json (la que está abierta). Guardar como: con otro nombre, una arena nueva
async function save(k = key) {
  if (!SERVED) { toast("Para guardar, abrí el editor con serve.py (o Exportar y copiar el archivo a prototypes/arena/arenas/)"); return false; }
  if (!KEY_RE.test(k)) return saveAs();
  try {
    const r = await (await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: k, arena: clean(A) }) })).json();
    if (!r.ok) throw new Error(r.error);
    key = k; ARENAS[key] = clean(A); saved = JSON.stringify(A); dirty = false; keepWip(); history.replaceState(null, "", "#" + key);
    topbar(); status();
    toast(`Guardada en ${r.file}.${k.includes("/") ? "" : " En el menú del juego aparece cuando se arma de nuevo; para probarla ya, \"Probar en el juego\"."}`);
    return true;
  } catch (err) { toast(`No se pudo guardar: ${err.message}`); return false; }
}
async function saveAs() {
  if (!SERVED) return save();
  const base = key.split("/").pop(), guess = KEY_RE.test(base) ? `${base}_2` : "nueva";
  const k = keyOf((await ask("Guardar como: el nombre del archivo (minúsculas, números y _). Queda en prototypes/arena/arenas/<nombre>.json y es una arena más del menú del juego.", { input: guess, ok: "Guardar" })) || "");
  if (!k) return false;
  if (!KEY_RE.test(k)) { toast(`Nombre inválido: ${k}`); return false; }
  if (ARENAS[k] && k !== key && !(await ask(`Ya existe arenas/${k}.json. ¿La pisás?`, { ok: "Pisarla" }))) return false;
  return save(k);
}
// lo que se está editando y no se guardó queda en este navegador: si la página se recarga, vuelve
const WIP = "arena-editor-wip";
function keepWip() {
  try { if (dirty) localStorage.setItem(WIP, JSON.stringify({ key, arena: clean(A), t: Date.now() })); else localStorage.removeItem(WIP); } catch (err) { /* sin localStorage */ }
}
// un cartel propio en vez de confirm/prompt (el navegador del panel de Claude no siempre los muestra)
function ask(msg, { input = null, ok = "Aceptar", cancel = "Cancelar" } = {}) {
  return new Promise(res => {
    const d = $("dlg"), inp = $("dlgIn");
    $("dlgMsg").textContent = msg; $("dlgOk").textContent = ok; $("dlgNo").textContent = cancel;
    inp.hidden = input === null; inp.value = input ?? "";
    d.returnValue = "";
    d.onclose = () => res(d.returnValue === "ok" ? (input === null ? true : inp.value.trim()) : null);
    d.showModal(); if (input !== null) { inp.focus(); inp.select(); } else $("dlgOk").focus();
  });
}
// probar: la arena va por localStorage (mismo origen) y el juego la abre con ?arena=editor, sin guardar nada
// probar: el juego, dentro del editor, encima del lienzo. La arena va por localStorage (mismo origen) y el juego la abre
// con ?arena=editor; arranca solo en "probar arena solo" (desde el spawn elegido, si hay uno). Esc en el juego (vuelve a
// su menú) o "◀ Editar" vuelven a editar, donde estaba. ⇧ + clic: en otra pestaña
let playing = null;
async function play(newTab = false) {
  if (playing) return stopPlay();
  try { localStorage.setItem("arena-editor", JSON.stringify({ key, arena: clean(A), t: Date.now() })); }
  catch (err) { return toast("No se pudo pasar la arena al juego (localStorage)"); }
  if (SERVED) {
    try {
      const s = await (await fetch("/api/game")).json();
      if (!s.built) {
        toast("Armando el juego (prototypes/arena/build.py)…");
        const r = await (await fetch("/api/build", { method: "POST" })).json();
        if (!r.ok) return toast("No se pudo armar el juego:\n" + r.out.slice(-600));
      }
    } catch (err) { /* sin servidor del editor: se abre igual */ }
  }
  const url = new URL(GAME, location.href).href;
  if (newTab) { if (!window.open(url, "arena-juego")) toast("El navegador no dejó abrir otra pestaña"); return; }
  const fr = $("playFrame"), spawn = sel && sel.t === "spawn" ? sel.i : -1;
  playing = { started: false, timer: 0 };
  $("playLayer").hidden = false; topbar();
  fr.onload = () => {
    let w = null; try { w = fr.contentWindow; w.startTest; } catch (err) { w = null; }
    if (!w || typeof w.startTest !== "function") return;   // otro origen o un juego viejo: queda su menú
    const go = () => {
      if (!playing) return;
      w.startTest();   // (G, players y ARENA son const/let del juego: no cuelgan de window, se leen con eval)
      if (spawn >= 0) w.eval(`if (ARENA.spawns[${spawn}]) { G.testSpawn = ${spawn}; resetPlayer(players[0], ARENA.spawns[${spawn}]); players[0].lives = 99; }`);
      playing.started = true; fr.focus(); w.focus();
    };
    setTimeout(go, 50);
    // Esc en el juego lo manda a su menú: ahí se vuelve a editar
    playing.timer = setInterval(() => { try { if (playing && playing.started && w.eval("G.state") === "lobby") stopPlay(); } catch (err) { /* nada */ } }, 150);
  };
  fr.src = url;
}
function stopPlay() {
  if (!playing) return;
  clearInterval(playing.timer); playing = null;
  $("playFrame").onload = null; $("playFrame").src = "about:blank"; $("playLayer").hidden = true;
  topbar(); cv.focus(); draw();
}
let toastT = 0;
function toast(s) { const t = $("toast"); t.textContent = s; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3500); }
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// #nombre en la dirección: abre esa arena (también al cambiarlo a mano)
window.addEventListener("hashchange", async () => {
  const k = decodeURIComponent(location.hash.slice(1));
  if (k === key || !ARENAS[k]) return;
  if (dirty && !(await ask("Hay cambios sin guardar en esta arena. ¿Cambiar igual y perderlos?", { ok: "Cambiar" }))) { history.replaceState(null, "", "#" + key); return; }
  openArena(k, ARENAS[k]);
});

/* ---------- arranque ---------- */
new ResizeObserver(() => { resize(); }).observe(cv);
buildEnv();
(async () => {
  ARENAS = BUILT;
  if (SERVED) { try { ARENAS = await (await fetch("/api/arenas")).json(); } catch (err) { toast("Sin servidor: arenas de cuando se armó el editor"); } }
  const want = decodeURIComponent(location.hash.slice(1));
  let wip = null; try { wip = JSON.parse(localStorage.getItem(WIP) || "null"); } catch (err) { /* nada */ }
  resize();
  if (wip && wip.arena && wip.key && (!want || want === wip.key || !ARENAS[want])) {   // lo que quedó sin guardar
    const disk = ARENAS[wip.key];
    if (!disk) ARENAS[wip.key] = clean(wip.arena);
    // lo que en disco se le agregó después a una pieza (las patas) completa la del borrador
    for (const [n, p] of Object.entries((disk && disk.pieces) || {})) { const q = wip.arena.pieces && wip.arena.pieces[n]; if (q) for (const f in p) if (!(f in q)) q[f] = p[f]; }
    openArena(wip.key, wip.arena);
    saved = disk ? JSON.stringify(normalize(clean(disk))) : ""; dirty = JSON.stringify(A) !== saved; keepWip(); topbar(); status();
    if (dirty) toast("Volvieron los cambios sin guardar de la otra vez");
    return;
  }
  const k = ARENAS[want] ? want : ARENAS.refineria ? "refineria" : Object.keys(ARENAS)[0];
  if (k) openArena(k, ARENAS[k]);
})();
</script>
