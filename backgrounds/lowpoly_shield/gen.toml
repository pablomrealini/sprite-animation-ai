# El power-up de escudo de la arena (prototypes/arena) en el estilo low-poly, para que haga juego con los de vida y
# granadas ya elegidos (backgrounds/lowpoly_pickups, la hoja 1 de GPT Image): la misma armadura blanca y gris oscura,
# y su luz, celeste. Más la burbuja que rodea al personaje mientras tiene el escudo.
#   - pickup: el power-up que flota, en dos diseños por hoja para elegir: shield (escudo clásico, con la punta abajo) y
#     buckler (redondo). Flota a ~42 px del juego de alto, como hp y gren: formas grandes, la luz celeste bien visible.
#   - bubble: la cúpula facetada semitransparente alrededor del personaje (~90 px del juego de alto, la burbuja ~120),
#     entera (dome) y rajada a punto de romperse (crack, para el último golpe o cuando se acaba). Low-poly porque un
#     círculo por código se ve plano al lado del resto; los pedazos que vuelan al romperse los pone el código (shards).
#     Sale celeste para todos: si se quiere por equipo, se recolorea como el fogonazo.
# Desde la raíz del repo:
#   uv run --project pipeline spritepipe gen-images backgrounds/lowpoly_shield/gen.toml --dry-run
#
# Modelo: GPT Image 2.5 Sunburst, con alfa nativo (la burbuja semitransparente y el brillo no se pueden keyear de un
# verde). Referencias de estilo: hp y gren elegidos, para que el escudo salga de la misma familia.
# Cada pieza tiene que salir de una sola mancha (el post separa la hoja por componentes conexos del alfa).
#
# Generadas el 2026-10-18 (US$0,68). Elegidas:
#   - pickup: shield de la hoja 1 (post/pickup/gpt-image-2.5-sunburst-fal_1/shield.png). A 46 px del juego de alto, como
#     hp y gren, mide 43 × 46 y es el que más se lee como escudo: el redondo parece una gema. El de la hoja 2 sale casi
#     igual. Ninguno trae el brillo alrededor que se pidió: el aro y el haz de color los pone el código.
#   - bubble: dome y crack de la hoja 2 (post/bubble/gpt-image-2.5-sunburst-fal_2/). Es más transparente (39% de la
#     burbuja opaca contra 61%), así el personaje se ve con los colores de su equipo, y la rajada tiene un hueco: se lee
#     a punto de romperse. A 130 px del juego de alto (126 × 130), con el centro ~55 px arriba de los pies.
#   El "toca el borde" del post es falso: en el borde hay alfa 1 de 255 (ruido), y el post cuenta cualquier alfa > 0.
# Revisión a tamaño de juego, sobre verde, sobre oscuro y sobre la Refinería: revision.png.

[gen]
models = ["gpt-image-2.5-sunburst-fal"]
images_per_asset = 2      # dos hojas por asset para elegir
max_usd = 2
max_parallel = 4
quality = "high"
resolution = "2K"
ref_bg = "#FFFFFF"

[styles]
lowpoly = """
3D low-poly game prop render in the exact style of the reference images: flat-shaded polygons with soft per-face \
lighting, clean faceted geometry, a few large facets rather than many small ones, saturated toy-like colors, soft \
studio light from the top left, no black outlines, no texture noise, no photographic detail.
"""
no_text = "No text, letters, numbers, logos, frames, circles, badges, borders, grid lines or labels anywhere."

[[asset]]
name = "pickup"           # el power-up de escudo, dos diseños para elegir
style = ["lowpoly", "no_text"]
prompt = """
Two separate collectible shield power-up props for a 2D arena shooter, from the same family as the medkit and the \
grenade pack in the reference images (the same white faceted armor plates, dark grey straps and rims, and a glowing \
crystal light), in one row, the same size, with wide empty space between them, not touching each other or the image \
edges, both seen from the front and slightly from above, floating (no ground, no shadow, no pedestal). Big chunky \
shapes that still read at 40 pixels tall. Each one is a single solid object.
1. A chunky low-poly heater shield, wide at the top and pointed at the bottom, a white faceted face with a thick dark \
grey beveled rim, and a big glowing cyan-blue faceted crystal emblem in the center shaped like a chevron, with a \
soft cyan glow around the shield.
2. A chunky low-poly round buckler shield, a white faceted face with a thick dark grey beveled rim and four short \
dark grey bolts, and a big glowing cyan-blue faceted hexagonal crystal in the center, with a soft cyan glow around \
the shield.
"""
refs = ["../lowpoly_pickups/post/pickups/gpt-image-2.5-sunburst-fal_1/hp.png", "../lowpoly_pickups/post/pickups/gpt-image-2.5-sunburst-fal_1/gren.png"]
ref_role = "style"
aspect = "16:9"
alpha = "cutout"
split = ["shield", "buckler"]

[[asset]]
name = "bubble"           # la burbuja alrededor del personaje: entera y rajada
style = ["lowpoly", "no_text"]
prompt = """
Two separate low-poly energy shield bubbles for a 2D arena shooter, the protective force field that surrounds a \
character, in one row, the same size, with wide empty space between them, not touching each other or the image \
edges, seen from the front, empty inside (no character, nothing inside). Each one is a single faceted geodesic \
sphere, slightly taller than wide, made of big flat triangular glass facets: a translucent pale cyan-blue tint, \
mostly see-through in the middle, the facets brighter and more opaque near the rim, thin bright cyan-white edges \
between the facets, a few facets on the top left catching a white highlight. No soft airbrushed glow outside it, no \
sparkles, no particles.
1. The intact bubble.
2. The same bubble about to break: a few facets missing or cracked with jagged bright cracks across it, but still \
one single connected shape, no detached shards.
"""
refs = ["../lowpoly_pickups/post/pickups/gpt-image-2.5-sunburst-fal_1/hp.png", "../lowpoly_fx/post/impact/gpt-image-2.5-sunburst-fal_2/i2.png"]
ref_role = "style"
aspect = "16:9"
alpha = "cutout"
split = ["dome", "crack"]
