# El mismo personaje por la rama pixel art
[character]
name = "synthetic_px"
style = "pixel"
game_fps = 8
target_height = 48
palette_colors = 12
scale_reference = "idle"

[output]
work_dir = "work_px"
out_dir = "out_px"

[[animation]]
name = "idle"
clip = "clips/idle.mp4"
kind = "cycle"
loop_seconds = [1.0, 2.5]
model = "sintético"

[[animation]]
name = "walk"
clip = "clips/walk.mp4"
kind = "cycle"
pose = "poses/walk.png"
model = "sintético"

[[animation]]
name = "attack"
clip = "clips/attack.mp4"
kind = "oneshot"
pose = "poses/attack.png"
model = "sintético"
holds = { 3 = 2.0 }   # el impacto dura el doble
