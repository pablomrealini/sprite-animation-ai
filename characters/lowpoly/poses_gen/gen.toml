# Pose de arranque sin arma para la estrategia C del bake-off del idle: el personaje con la mano en pose de agarre
# (sin pistola) y el arma como sprite aparte, pegada a la mano en cada cuadro.
# Se edita desde la vista de perfil con el cinturón rojo (poses/perfil_cinturon_rojo_concept.png: recortada de
# refs/costado_con_arma.png y pintada con cinturon_rojo.py).
# Desde la raíz del repo:
#   uv run --project pipeline spritepipe gen-images characters/lowpoly/poses_gen/gen.toml --dry-run
# La elegida se pasa por `spritepipe pad-pose ... --bg C42D7D` (magenta apagado) antes de mandarla al video.

[gen]
models = ["gpt-image-2.5-sunburst-fal", "nano-banana-2.1"]
images_per_asset = 2
max_usd = 2
max_parallel = 2
key_color = "#00FF00"     # para el modelo sin alfa (Nano Banana); sin arma, el personaje no tiene verde ni cian
quality = "high"
resolution = "2K"
seed = 7
ref_bg = "#C0C3CC"        # el gris de las hojas low-poly: sobre blanco, el casco se pierde

[styles]
same = """
Use the attached image as the exact reference for the character: the same chunky low-poly 3D character, same \
design, same proportions, same colors, the same faceted flat-shaded low-poly rendering and the same soft studio \
lighting. Full body, side view facing right, the same pose, size and framing as the reference.
"""
no_text = "No text, letters, numbers or logos."

[[asset]]
name = "sin_arma"         # primer cuadro de la estrategia C
style = ["same", "no_text"]
prompt = """
Remove the laser pistol completely and change nothing else. The right arm stays exactly where it is, bent \
forward at chest height, and the right glove keeps exactly the same closed gripping shape as if it were still \
holding the pistol grip: the fingers curled into a loose fist around an empty space, the thumb resting on top, \
the fist pointing forward to the right. The hand is empty: no gun, no object, no glow. The left arm, the body, \
the helmet and the legs stay identical. Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/perfil_cinturon_rojo_concept.png"]
ref_role = "character"
aspect = "2:3"
alpha = "cutout"

[[asset]]
name = "correr"           # primer y último cuadro del run (correr en el lugar, loop cerrado)
style = ["same", "no_text"]
prompt = """
Change only the pose into a running stride, mid-step, seen exactly from the side: the front leg reaching forward \
with the heel touching the ground, the back leg pushed back with only the toe touching the ground, the legs \
clearly separated, both boots pointing to the right, the torso leaning slightly forward. The right hand keeps \
holding the same laser pistol forward at chest height, pointing straight to the right; the left hand is a fist \
at chest height. Same helmet, same red belt, same proportions and the same size as the reference. Matte flat \
colors with no shine and no reflections.
"""
refs = ["../poses/perfil_cinturon_rojo_concept.png"]
ref_role = "character"
aspect = "2:3"
alpha = "cutout"

[[asset]]
name = "colgado_dos"      # primer cuadro de la subida y del colgado a dos manos (climb_frames.py arma los 16:9)
style = ["same", "no_text"]
prompt = """
Change only the pose: he hangs from the top edge of an invisible ledge with both hands. Both arms are raised above \
the helmet and both gloves grip the edge side by side, at the same height, the fingers curled over the top of the \
edge. The laser pistol stays in his right hand, lying flat along the top of the edge and pointing to the right. \
The body hangs straight down below the hands, close to an invisible wall in front of him: the chest, the knees and \
the tips of both boots almost touch that wall, the legs together and relaxed, the boots pointing to the right. Same \
helmet, same red belt, same proportions. Nothing is drawn: no ledge, no wall, no platform, no object and no shadow. \
Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/perfil_cinturon_rojo_concept.png"]
ref_role = "character"
aspect = "2:3"
alpha = "cutout"

# --- tanda 2 (revisión de Pablo): colgarse a cuerpo completo, la granada en la mano y la bolita del doble salto. ------
# Todas desde la pose con el arma apagada (disco cian pintado de gris: apagar_arma.py), porque Kling dibuja fogonazo
# cuando el disco brilla. Colgarse "como el Prince of Persia": el personaje entero con las manos arriba agarrando un
# canto que no se dibuja, así funciona en cualquier plataforma.

[[asset]]
name = "colgado_una"      # primer y último cuadro del colgado de una mano (loop) y último de hang_in
style = ["same", "no_text"]
prompt = """
Change only the pose: he hangs from the top edge of an invisible ledge with his left hand only. The left arm is \
raised straight above the helmet and the left glove grips the edge, the fingers curled over the top of an edge that \
is not drawn. The right arm hangs relaxed down along the body, the right hand holding the same dark pistol pointing \
down. The whole body hangs straight down below the hand, fully visible from the hand to the boots, the legs together \
and relaxed, the boots pointing to the right. Same helmet, same red belt, same proportions. Nothing is drawn: no \
ledge, no wall, no platform, no object and no shadow. Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/perfil_apagada_concept.png"]
ref_role = "character"
aspect = "2:3"
alpha = "cutout"

[[asset]]
name = "colgado_dos_cinturon"  # primer cuadro de la subida y del colgado a dos manos: el arma en el cinturón
style = ["same", "no_text"]
prompt = """
Change only the pose: he hangs from the top edge of an invisible ledge with both hands. Both arms are raised above \
the helmet and both gloves grip the edge side by side, at the same height, the fingers curled over the top of an \
edge that is not drawn. His hands are empty: the same dark pistol is tucked into his red belt at the right hip, \
pointing down. The whole body hangs straight down below the hands, fully visible from the hands to the boots, close \
to an invisible wall: the legs together and relaxed, the boots pointing to the right. Same helmet, same red belt, \
same proportions. Nothing is drawn: no ledge, no wall, no platform, no object and no shadow. Matte flat colors with \
no shine and no reflections.
"""
refs = ["../poses/perfil_apagada_concept.png"]
ref_role = "character"
aspect = "2:3"
alpha = "cutout"

[[asset]]
name = "bolita"           # el doble salto: el juego hace girar esta pose (Kling deforma al personaje en el mortal)
style = ["same", "no_text"]
prompt = """
Change only the pose into the middle of a forward somersault, seen exactly from the side: he is curled into a tight \
ball, knees pulled up to the chest, both arms hugging the shins, the helmet tucked forward over the knees, the same \
dark pistol held in the right hand against the shins. Compact and round, as if frozen while spinning. Same helmet, \
same red belt, same proportions. Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/perfil_apagada_concept.png"]
ref_role = "character"
aspect = "1:1"
alpha = "cutout"

[[asset]]
name = "granada"          # la granada del low-poly: el juego la dibuja cuando sale de la mano
style = ["no_text"]
prompt = """
A single small hand grenade for this game, alone, seen from the side: a chunky low-poly 3D model made of a few big \
faceted polygons with flat shading, like the character in the reference. A rounded dark gray body with a red band \
around the middle, a short gray fuse cap on top with a small ring pull on the side. Soft even studio lighting, matte \
surfaces, no shine and no reflections. Centered, filling most of the image.
"""
refs = ["../poses/perfil_apagada_concept.png"]
ref_role = "style"
aspect = "1:1"
alpha = "cutout"

[[asset]]
name = "con_granada"      # primer cuadro de tirar la granada: la granada de poses/granada.png en la mano libre
style = ["same", "no_text"]
# La mano izquierda es la de atrás: a la altura del pecho la tapan el brazo derecho y el arma. Por eso va al frente
# del cinturón, debajo del puño derecho, donde se ve entera contra el fondo (tanda 3, generate_tanda3.toml).
prompt = """
Change only the left arm and hand: the left arm comes forward, bent, and the left hand now holds the hand grenade \
shown in the second reference image (the same grenade, same shape and colors, about the size of the fist) in front \
of the red belt, just below the right fist, the fingers wrapped around it and the red ring pull on top. The grenade \
is fully visible against the background, not hidden by the right arm or the pistol. The right hand keeps holding the \
same dark pistol close to the chest, pointing forward. Everything else stays identical: the helmet, the red belt, \
the legs and the stance. Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/perfil_apagada_concept.png", "../poses/granada.png"]
ref_role = "character"
aspect = "2:3"
alpha = "cutout"

[[asset]]
name = "con_granada_cerca"  # tirar la granada, toma 2: la granada en la mano de adelante (la derecha) y la pistola en la
                            # de atrás. Con la granada en la mano de atrás (con_granada), Kling giró al personaje hacia
                            # cámara para mostrar el tiro en las dos tomas (tanda3/throw_1 y _2)
style = ["same", "no_text"]
prompt = """
Change only the hands. The right hand, the near hand on the viewer's side of the body, now holds the hand grenade \
shown in the second reference image (the same grenade, same shape and colors, about the size of the fist) at chest \
height in front of the body, the fingers wrapped around it and the red ring pull on top, fully visible against the \
background. The left hand, the far hand behind the body, now holds the same dark pistol at chest height, pointing \
forward to the right, its barrel showing in front of the chest just above the grenade. Everything else stays \
identical: the helmet, the red belt, the legs and the stance. Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/perfil_apagada_concept.png", "../poses/granada.png"]
ref_role = "character"
aspect = "2:3"
alpha = "cutout"

[[asset]]
name = "deslizarse"       # tanda 4: la pose fija del slide (último cuadro de slide_in y primero de slide_out). Pedida
                          # con palabras, Kling la hizo sentado con las piernas abiertas (tanda3 slide_2): acá se fija
style = ["same", "no_text"]
prompt = """
Change only the pose into a low feet-first slide along the floor, seen exactly from the side and moving to the \
right, like the slide of a classic 2D platformer hero. The front leg is stretched straight forward, flat along the \
floor, the sole of the boot facing forward to the right. The back leg is bent under the body with the knee pointing \
up, in line with the front leg: seen from the side, never spread apart. The torso is low and leans back. The left \
hand, the far one, rests flat on the floor behind the body, dragging. The head is up, looking right. The right hand \
holds the same dark pistol close to the chest, pointing forward, not aiming. A compact, low pose, like an arrow \
sweeping the floor, about half his standing height. Same helmet, same red belt, same proportions and the same size \
as the reference. Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/perfil_apagada_concept.png"]
ref_role = "character"
aspect = "3:2"
alpha = "cutout"

# --- tanda 4b: la pose del slide corregida (Pablo, 2026-10-18: "la pierna al hacer slide está mucho más grande de lo
# que es la proporción del personaje (son más cortas las piernas), el brazo está en una posición rara"). Ediciones de
# la elegida (poses/deslizarse_concept.png, GPT Image 2) con la de perfil como referencia de proporciones. Medido en
# perfil_apagada_dullmagenta_16x9 (casco de 243 px de ancho): de la cadera a la suela, 137 px (0,56 casco); la bota,
# ~0,5 casco de largo. En la elegida, la pierna estirada medía 1,5 cascos. Dos brazos para elegir.

[[asset]]
name = "deslizarse_b"     # pierna corta y el arma pegada al pecho con el brazo doblado
style = ["no_text"]
prompt = """
Edit the first reference image, the character in a low feet-first slide seen from the side facing right. Keep the \
same slide: the body low and leaning back, the left hand flat on the floor behind him, the head up looking right, \
the same helmet, colors and low-poly rendering. Fix only two things. \
First, the proportions: use exactly the chibi proportions of the second reference image, the same character \
standing: short, thick legs and short arms. Measured in helmet widths, each leg from the hip to the sole of the boot \
is only about 0.55 of the helmet width, and the boot is about half the helmet width long. So the stretched front leg, \
from the hip to the sole, is a little more than half as long as the helmet is wide, never longer; the back leg is \
bent with the knee up and is just as short. The whole pose is compact: about 1.7 helmet widths long and 1.4 helmet \
widths tall. \
Second, the right arm: bent and relaxed, the elbow down against the side of the body, the right hand holding the \
same dark pistol tight against the chest, pointing forward and slightly up, not aiming and not stretched out. \
Full body, side view facing right. Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/deslizarse_concept.png", "../poses/perfil_apagada_concept.png"]
ref_role = "character"
aspect = "3:2"
alpha = "cutout"

[[asset]]
name = "deslizarse_c"     # pierna corta y la mano de adelante también abajo, el arma al ras del piso junto a la rodilla
style = ["no_text"]
prompt = """
Edit the first reference image, the character in a low feet-first slide seen from the side facing right. Keep the \
same slide: the body low and leaning back, the left hand flat on the floor behind him, the head up looking right, \
the same helmet, colors and low-poly rendering. Fix only two things. \
First, the proportions: use exactly the chibi proportions of the second reference image, the same character \
standing: short, thick legs and short arms. Measured in helmet widths, each leg from the hip to the sole of the boot \
is only about 0.55 of the helmet width, and the boot is about half the helmet width long. So the stretched front leg, \
from the hip to the sole, is a little more than half as long as the helmet is wide, never longer; the back leg is \
bent with the knee up and is just as short. The whole pose is compact: about 1.7 helmet widths long and 1.4 helmet \
widths tall. \
Second, the right arm: relaxed and low, the right hand resting near the floor beside the hip, holding the same dark \
pistol flat along the floor and pointing forward, not aiming and not stretched out. \
Full body, side view facing right. Matte flat colors with no shine and no reflections.
"""
refs = ["../poses/deslizarse_concept.png", "../poses/perfil_apagada_concept.png"]
ref_role = "character"
aspect = "3:2"
alpha = "cutout"

[[asset]]
name = "deslizarse_d"     # opcional: la b/gpt_1 con el muslo acortado (pierna estirada ~1,0 casco → ~0,75)
style = ["no_text"]
prompt = """
Edit the first reference image and change only the length of the front leg, the one stretched along the floor. Its \
dark gray trouser part, from the hip to the top of the red boot, must be much shorter: only about a quarter of the \
helmet width, as short as the trouser part of the legs in the second reference image, the same character standing. \
Move the boot back toward the hip by that amount and keep the boot exactly the same size and shape. Everything else \
stays identical: the helmet, the head, the bent right arm holding the pistol against the chest, the left hand flat \
on the floor behind him, the bent back leg, the colors and the low-poly rendering. Full body, side view facing \
right. Matte flat colors with no shine and no reflections.
"""
refs = ["post/deslizarse_b/gpt-image-2.5-sunburst-fal_1.png", "../poses/perfil_apagada_concept.png"]
ref_role = "character"
aspect = "3:2"
alpha = "cutout"
