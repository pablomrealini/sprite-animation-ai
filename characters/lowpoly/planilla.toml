# Planilla del set de la arena: el ranger del juego y el low-poly, clip por clip. planilla.py arma planilla.html con
# los dos animados lado a lado (las previews de out/ de cada personaje), la pose de arranque y el estado.
#   uv run --project pipeline python characters/lowpoly/planilla.py
# Se ve servida por http, como compare.html (config sprite-previews de .claude/launch.json):
#   http://localhost:8765/lowpoly/planilla.html
#
# estado: "hecho" (en el atlas low-poly) · "a rehacer" (revisión de Pablo) · "listo" (pose y config listas, falta generar) · "falta pose" ·
# "descartado". tomas y usd son lo generado hasta ahora (precio de lista). Las animaciones son las que usa la arena,
# con los mismos nombres en los dos atlas.

[[clip]]
name = "Idle de combate"
ranger = "g07 · Seedance 2.0 por fal"
anims = ["idle_combat"]
pose = "poses/perfil_dullmagenta_16x9.png"
config = "generate_idle.toml"
estado = "hecho"
tomas = 2
usd = 0.84
nota = "Toma 2 del idle A de Kling. El bake-off de estrategias (A, B, C) está en compare.html."

